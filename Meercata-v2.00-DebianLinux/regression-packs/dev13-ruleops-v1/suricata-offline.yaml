%YAML 1.1
---

vars:
  address-groups:
    HOME_NET: "any"
    EXTERNAL_NET: "any"

default-rule-path: .
rule-files: []

outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert

logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: no
