[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meercata"
version = "1.0.0"
description = "Safety-focused Suricata IDS/IPS and NFQUEUE management utility"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
meercata = "main:main"
suricatamon = "suricatamon:main"

[tool.setuptools]
py-modules = ["hooks", "main", "platform_support", "preflight", "suricata_ctl", "suricatamon", "systemd_unit", "utils", "yaml_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
pythonpath = ["."]
