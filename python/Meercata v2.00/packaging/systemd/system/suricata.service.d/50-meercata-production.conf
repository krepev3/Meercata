# Meercata production supervision policy for the distribution Suricata unit.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=3

[Service]
Type=notify
NotifyAccess=main
ExecStartPre=/usr/bin/suricata -T -c /etc/suricata/suricata.yaml --init-errors-fatal
# Live rule changes are transaction-bound through meercata-helper, never systemctl reload.
ExecReload=
Restart=on-failure
RestartSec=10s
TimeoutStartSec=90s
TimeoutStopSec=60s
OOMPolicy=stop
UMask=0027
LimitNOFILE=65536
TasksMax=4096
PrivateTmp=true
ProtectHome=true
ProtectClock=true
ProtectHostname=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
RestrictSUIDSGID=true
RestrictRealtime=true
LockPersonality=true
SystemCallArchitectures=native
